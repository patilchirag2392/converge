# Converge client -- static file serving for the built Vite bundle.
#
# Dropped into /etc/nginx/conf.d/default.conf, which the nginx image includes
# from inside its http{} block. Only the server{} belongs here.
#
# This nginx serves files and nothing else. It does NOT proxy WebSockets: the
# browser connects straight to the load balancer on :8080. Keeping the two
# nginx roles separate is what makes "which instance am I on?" answerable --
# see deploy/nginx.docker.conf.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames (app-C4f9x2.js), so an asset at a
    # given URL can never change. Cache them hard; the hash is the cache key.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the opposite case: same URL forever, new content on every
    # deploy. Caching it would pin browsers to a stale bundle that references
    # asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback. The app reads its document from ?doc=..., so today every
    # route is /, but a client-side router would 404 on refresh without this.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
