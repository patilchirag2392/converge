# Converge — Stage 3 load balancer.
#
# Two server instances, round-robin. Runs unprivileged on :8080; start it with
#   nginx -p deploy/.run -c ../nginx.conf
# or just use scripts/cluster.sh.

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # A WebSocket handshake is an HTTP request carrying `Upgrade: websocket`.
    # Hop-by-hop headers are not forwarded by default, so without this map the
    # handshake reaches the backend stripped and the connection fails as a plain
    # HTTP request. The '' case closes rather than upgrades, so ordinary requests
    # are unaffected.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream converge_backends {
        # Round-robin (nginx's default) on purpose.
        #
        # `ip_hash` or `sticky` would pin each client to one instance and appear
        # to fix Stage 3 -- but it only hides the problem: two *different* users
        # still land on different instances and still can't see each other, and
        # any rebalance or instance restart breaks it anyway. Cross-instance
        # propagation is the actual requirement.
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://converge_backends;

            # WebSockets need HTTP/1.1; the default to upstreams is 1.0.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # An editor socket is idle whenever nobody is typing. The default 60s
            # read timeout would drop it mid-session and force a reconnect.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
