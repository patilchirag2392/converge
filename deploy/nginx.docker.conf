# Converge load balancer -- the containerised twin of nginx.conf.
#
# Dropped into /etc/nginx/conf.d/default.conf. The stock nginx image supplies
# worker_processes / events{} / http{} and includes this from inside http{}, so
# unlike the host-run nginx.conf this file carries no top-level boilerplate.
#
# Two differences from nginx.conf, and only two:
#
#   1. upstreams are `server-a:8000` / `server-b:8000` -- compose service names
#      resolved by Docker's embedded DNS -- instead of 127.0.0.1:8001/8002.
#      Each container has its own network namespace, so every instance can use
#      the same port 8000 without colliding, and no host ports are involved.
#   2. no `pid`/`error_log` overrides; the base image's defaults already point
#      logs at stdout/stderr, which is what `docker compose logs` reads.
#
# Everything below this line is the same reasoning as Stage 3.

# A WebSocket handshake is an HTTP request carrying `Upgrade: websocket`.
# Hop-by-hop headers are not forwarded by default, so without this map the
# handshake reaches the backend stripped and fails as a plain HTTP request.
# The '' case closes rather than upgrades, so ordinary requests are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream converge_backends {
    # Round-robin (nginx's default) on purpose.
    #
    # `ip_hash` or `sticky` would pin each client to one instance and appear to
    # fix Stage 3 -- but it only hides the problem: two *different* users still
    # land on different instances and still can't see each other, and any
    # rebalance or instance restart breaks it anyway. Cross-instance
    # propagation is the actual requirement.
    #
    # Names, not IPs: nginx resolves these once at startup, which is fine
    # because compose starts the servers first (depends_on: service_healthy)
    # and their addresses are stable for the life of the container. The stale
    # case, and why it is accepted here, is in NOTES.md.
    server server-a:8000;
    server server-b:8000;
}

server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://converge_backends;

        # WebSockets need HTTP/1.1; the default to upstreams is 1.0.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # An editor socket is idle whenever nobody is typing. The default 60s
        # read timeout would drop it mid-session and force a reconnect.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
