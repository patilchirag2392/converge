# Converge -- the public edge, on a single EC2 box.
#
# The difference from nginx.docker.conf is not the upstreams, it is the *job*.
# Locally, nginx load-balances and the client is served separately on :5173.
# Here nginx is the only thing listening on the internet, so it does both:
#
#   /            -> client  (the built bundle, served by the client container)
#   /ws/...      -> server-a | server-b   (WebSockets, round-robin)
#   /api/...     -> server-a | server-b
#   /healthz     -> server-a | server-b
#   /metrics     -> server-a | server-b
#
# One origin has three consequences worth stating, because they are the reason
# for the design and not side effects:
#
#   1. ONE open port. The security group needs 80 (and 443), not 80 + 5173 +
#      8001 + 8002. Every port not open is an attack surface that does not exist.
#   2. NO CORS. The page and its WebSocket share scheme, host and port, so the
#      browser has nothing to object to. The CORSMiddleware in app/main.py is
#      still there for the localhost dev flow; it is simply not load-bearing here.
#   3. The WebSocket URL is derivable from the page URL. It still has to be
#      baked into the bundle (Vite inlines it), but it is baked from a single
#      PUBLIC_HOST rather than assembled from several values.
#
# Dropped into /etc/nginx/conf.d/default.conf; the base image supplies http{}.

# A WebSocket handshake is an HTTP request carrying `Upgrade: websocket`.
# Hop-by-hop headers are not forwarded by default, so without this map the
# handshake reaches the backend stripped and fails as a plain HTTP request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream converge_backends {
    # Round-robin, still deliberately. On one box with two containers this is
    # the same argument as Stage 3: `ip_hash` would pin each browser to one
    # instance and make cross-instance propagation look solved without being
    # solved.
    server server-a:8000;
    server server-b:8000;
}

upstream converge_client {
    # The client container's own nginx, which does the static-file serving,
    # asset cache headers and SPA fallback. Proxying to it rather than copying
    # the bundle in here keeps one image responsible for the frontend.
    server client:80;
}

server {
    listen 80 default_server;
    server_name _;

    # Don't advertise the exact nginx version to the internet. Minor, but free.
    server_tokens off;

    # The bundle is ~199 KB uncompressed and ~63 KB gzipped. Over a real
    # network that difference is the page load, and it costs one directive.
    # The client container also serves pre-set cache headers; this only adds
    # transfer encoding.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ----------------------------------------------------------------- API --
    # Longest-prefix match wins in nginx, so these are matched before the `/`
    # location below regardless of order in the file.

    location /ws/ {
        proxy_pass http://converge_backends;

        # WebSockets need HTTP/1.1; the default to upstreams is 1.0.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An editor socket is idle whenever nobody is typing. The default 60s
        # read timeout would drop it mid-session and force a reconnect. This
        # matters more here than locally: a demo tab left open in a browser on
        # another continent is exactly the idle case.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://converge_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://converge_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Health checks are noise in the access log and there will be one every
        # few seconds forever.
        access_log off;
    }

    location = /metrics {
        proxy_pass http://converge_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Deliberately public, and deliberately called out. /metrics exposes
        # only propagation latency and a document count -- no document text, no
        # ids -- so it is a demo feature rather than a leak, and being able to
        # show it from a browser is the point. If this ever carried anything
        # sensitive, the right answer is `allow`/`deny` here or moving it off
        # the public listener entirely, not hoping nobody guesses the path.
    }

    # -------------------------------------------------------------- frontend --
    location / {
        proxy_pass http://converge_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
